<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
    <title>Ledger Entry</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg:     #0f172a;
            --card:   #111827;
            --accent: #3b82f6;
            --text:   #f1f5f9;
            --muted:  #94a3b8;
            --border: #4b5563;
            --input:  #0b1120;
            --error:  #f87171;
            --success:#4ade80;
            --shadow: rgba(0,0,0,.5);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg:     #e2e8f0;
                --card:   #ffffff;
                --accent: #1d4ed8;
                --text:   #0f172a;
                --muted:  #475569;
                --border: #94a3b8;
                --input:  #f8fafc;
                --error:  #dc2626;
                --success:#15803d;
                --shadow: rgba(0,0,0,.14);
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ── Auth screen ─────────────────────────────────────────── */
        #auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .auth-card {
            width: 100%;
            max-width: 360px;
            background: var(--card);
            padding: 32px 24px 24px;
            border-radius: 14px;
            box-shadow: 0 20px 40px var(--shadow);
            text-align: center;
        }

        .auth-card h1 { margin: 0 0 6px; font-size: 1.6rem; }
        .auth-card .subtitle { margin: 0 0 28px; color: var(--muted); font-size: 0.9rem; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .auth-msg {
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 1.2em;
            color: var(--error);
        }

        .card-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .hidden { display: none !important; }

        /* ── Main app screen ─────────────────────────────────────── */
        #app-screen {
            display: none;
        }

        .app-card {
            background: var(--card);
            padding: 16px 14px 24px;
            min-height: 100vh;
            max-width: 600px;
            margin: 0 auto;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .app-header h1 { margin: 0; font-size: 1.4rem; }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .logout-btn {
            font-size: 0.8rem;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .logout-btn:hover { background: rgba(59,130,246,0.1); }

        /* form fields */
        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 7px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .field input,
        .field textarea {
            width: 100%;
            padding: 15px 16px;
            border-radius: 10px;
            border: 2px solid var(--border);
            font-size: 1.1rem;
            background: var(--input);
            color: var(--text);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            font-family: inherit;
        }
        .field input:focus,
        .field textarea:focus { border-color: var(--accent); }

        .field textarea { resize: vertical; min-height: 72px; }

        /* Amount row */
        .amount-row {
            display: flex;
            border-radius: 10px;
            border: 2px solid var(--border);
            overflow: hidden;
        }
        .amount-row:focus-within { border-color: var(--accent); }

        .sign-toggle {
            width: 3.6rem;
            flex-shrink: 0;
            align-self: stretch;
            border: none;
            border-radius: 0;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            appearance: none;
            -webkit-appearance: none;
            margin: -2px 0 -2px -2px;
        }
        .sign-toggle.neg { background: #ef4444; }
        .sign-toggle.pos { background: #10b981; }

        .amount-input {
            flex: 1;
            padding: 15px 16px;
            border: none !important;
            border-radius: 0 !important;
            font-family: monospace;
            font-size: 1.5rem;
            background: var(--input);
            color: var(--text);
            outline: none;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 17px;
            border-radius: 10px;
            border: none;
            font-size: 1.15rem;
            font-weight: 700;
            background: var(--accent);
            color: white;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
            position: relative;
            letter-spacing: 0.02em;
        }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .submit-btn.loading { color: transparent; }
        .submit-btn.loading::after {
            content: "";
            position: absolute;
            width: 1.25rem;
            height: 1.25rem;
            top: 50%; left: 50%;
            margin: -0.625rem 0 0 -0.625rem;
            border: 3px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e293b;
            color: #e5e7eb;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            transition: transform 0.3s ease;
            z-index: 1000;
            white-space: nowrap;
            max-width: calc(100vw - 32px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-left: 4px solid #22c55e; }
        .toast.error   { border-left: 4px solid #ef4444; }

        /* Offline banner */
        .offline-banner {
            display: none;
            background: #7f1d1d;
            color: #fca5a5;
            text-align: center;
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        /* Schema loading state */
        .schema-loading {
            text-align: center;
            padding: 40px 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* ── Custom searchable select ─────────────────────────────── */
        .cs-wrap { position: relative; }

        .cs-trigger {
            width: 100%;
            padding: 15px 46px 15px 16px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 1.1rem;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s;
            min-height: 54px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            touch-action: manipulation;
        }
        .cs-trigger:focus,
        .cs-wrap.open .cs-trigger { border-color: var(--accent); }

        .cs-display.cs-placeholder { color: var(--muted); }

        .cs-chevron {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--muted);
            pointer-events: none;
            transition: transform 0.2s;
        }
        .cs-wrap.open .cs-chevron { transform: translateY(-50%) rotate(180deg); }

        .cs-panel {
            position: absolute;
            z-index: 200;
            top: calc(100% + 4px);
            left: -14px;
            right: -14px;
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 10px;
            box-shadow: 0 8px 28px var(--shadow);
            overflow: hidden;
        }
        .cs-panel[hidden] { display: none; }

        .cs-search-bar {
            padding: 8px 8px 6px;
            border-bottom: 1px solid var(--border);
        }

        .cs-search {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 2px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
        }
        .cs-search:focus { border-color: var(--accent); }

        .cs-list {
            list-style: none;
            margin: 0;
            padding: 4px;
            max-height: 220px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .cs-option {
            padding: 14px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: background 0.1s;
            user-select: none;
            -webkit-user-select: none;
        }
        .cs-option:hover        { background: rgba(59,130,246,0.12); }
        .cs-option.cs-focused   { background: rgba(59,130,246,0.15); }
        .cs-option.cs-selected  { background: rgba(59,130,246,0.18); color: var(--accent); font-weight: 500; }

        .cs-no-results {
            padding: 14px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* ── Section divider ─────────────────────────────────────── */
        .section-divider {
            height: 1px;
            background: var(--border);
            margin: 18px 0 16px;
            opacity: 0.6;
        }

        /* ── Install Prompt Overlay ──────────────────────────────── */
        .install-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 1);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .install-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .install-header {
            margin-bottom: 20px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            margin: 0 auto 16px;
            display: block;
            object-fit: contain;
            background: rgba(59, 130, 246, 0.1);
            padding: 8px;
        }

        .app-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .app-description {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .instruction {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.6;
            background: rgba(59, 130, 246, 0.08);
            padding: 14px 12px;
            border-radius: 10px;
            border-left: 3px solid var(--accent);
        }

        .ios-share-icon {
            display: inline-block;
            margin: 0 4px;
            vertical-align: middle;
            width: 18px;
            height: 18px;
        }

        .ios-share-icon svg {
            width: 100%;
            height: 100%;
            color: var(--accent);
        }

        .install-overlay.hidden {
            display: none;
        }

        @media (prefers-color-scheme: light) {
            .install-overlay {
                background: rgba(226, 232, 240, 1);
            }

            .app-icon {
                background: rgba(29, 78, 216, 0.08);
            }

            .instruction {
                background: rgba(29, 78, 216, 0.08);
                border-left-color: var(--accent);
            }

            .install-close-btn:hover {
                background: rgba(29, 78, 216, 0.1);
            }
        }

        /* ── Image picker ────────────────────────────────────────── */
        .img-pick-btn {
            width: 100%;
            padding: 18px 16px;
            border-radius: 10px;
            border: 2px dashed var(--border);
            background: var(--input);
            color: var(--muted);
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: border-color 0.15s, color 0.15s;
            touch-action: manipulation;
        }
        .img-pick-btn:hover, .img-pick-btn:focus {
            border-color: var(--accent);
            color: var(--text);
            outline: none;
        }
        .img-pick-btn svg { flex-shrink: 0; }

        .img-preview-wrap {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .img-preview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            border: 2px solid var(--border);
        }
        .img-remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.65);
            color: white;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .img-upload-status {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 6px;
            text-align: center;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

<!-- ─── Auth Screen ────────────────────────────────────────────────────── -->
<!-- style="display:none" prevents flash before JS determines auth state -->
<div id="auth-screen" style="display:none">
    <div class="auth-card">
        <h1>Ledger Entry</h1>
        <p class="subtitle">Access Instrumenta tools</p>
        <button class="btn-primary" id="signin-btn">Sign In</button>
        <div class="auth-msg" id="auth-msg"></div>
        <div class="card-footer">instrumenta.cc</div>
    </div>
</div>

<!-- ─── App Screen ────────────────────────────────────────────────────── -->
<div id="app-screen">
    <div class="app-card">
        <div class="app-header">
            <h1>Ledger Entry</h1>
            <div class="user-badge">
                <span id="username-display"></span>
                <button class="logout-btn" id="logout-btn">Sign out</button>
            </div>
        </div>

        <div class="offline-banner" id="offline-banner">No internet connection</div>

        <div class="schema-loading" id="schema-loading">Loading form…</div>

        <form id="entry-form" class="hidden">

            <div class="field">
                <label>Whose Account</label>
                <div class="cs-wrap" id="cs-account">
                    <input type="hidden" id="field-account">
                </div>
            </div>

            <div class="field">
                <label for="field-amount">Amount</label>
                <div class="amount-row">
                    <button type="button" class="sign-toggle neg" id="sign-toggle">−</button>
                    <input type="text" class="amount-input" id="field-amount" placeholder="0.00"
                           inputmode="decimal" pattern="[0-9]*\.?[0-9]*" required autocomplete="off">
                </div>
            </div>

            <div class="field">
                <label>Project</label>
                <div class="cs-wrap" id="cs-project">
                    <input type="hidden" id="field-project">
                </div>
            </div>

            <div class="section-divider"></div>

            <div class="field">
                <label for="field-fromto">From / To</label>
                <input type="text" id="field-fromto" autocomplete="off" list="fromto-suggestions" placeholder="Vendor or person">
                <datalist id="fromto-suggestions"></datalist>
            </div>

            <div class="field">
                <label for="field-notes">Notes</label>
                <textarea id="field-notes" rows="2" placeholder="Optional"></textarea>
            </div>

            <div class="field">
                <label>Receipt / Photo</label>
                <input type="file" id="field-image-input" accept="image/*" capture="environment" style="display:none">
                <button type="button" class="img-pick-btn" id="img-pick-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    Take photo or choose image
                </button>
                <div class="img-preview-wrap" id="img-preview-wrap" style="display:none">
                    <img class="img-preview" id="img-preview" src="" alt="Receipt preview">
                    <button type="button" class="img-remove-btn" id="img-remove-btn" aria-label="Remove image">✕</button>
                </div>
                <div class="img-upload-status" id="img-upload-status"></div>
            </div>

            <div class="field">
                <label for="field-date">Date</label>
                <input type="date" id="field-date" required>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Add Entry</button>
        </form>
    </div>
</div>

<!-- Install Prompt Overlay -->
<div class="install-overlay hidden" id="install-overlay">
    <div class="install-card">
        <div class="install-header">
            <img src="" alt="App Icon" class="app-icon" id="install-icon">
            <div class="app-title" id="install-title">Gleason Ledger Entry</div>
            <div class="app-description" id="install-description"></div>
        </div>
        <div class="instruction" id="install-instruction"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────

const AUTH_URL         = 'https://instrumenta.cc/api/auth.php';
const API_BASE         = 'https://instrumenta.cc/api/sheets';
const FILE_ID          = '00bc049ff4cd67c83313bc34';
const SHEET_ID         = 'sheet-1';
const TABLE_ID         = 'table-1774359687333-ovn2m';
const SCHEMA_URL       = `${API_BASE}/file/${FILE_ID}/sheet/${SHEET_ID}/table/${TABLE_ID}/schema`;
const ROWS_URL         = `${API_BASE}/file/${FILE_ID}/sheet/${SHEET_ID}/table/${TABLE_ID}/rows`;
const BLOBS_URL        = `${API_BASE}/blobs`;
const TOKEN_KEY       = 'ledger_session_token';
const USER_KEY        = 'ledger_username';
const FROMTO_HIST_KEY = 'ledger_fromto_history';

// ─── State ────────────────────────────────────────────────────────────────────

let sessionToken   = localStorage.getItem(TOKEN_KEY) || null;
let isNegative     = true;
let csAccount      = null;
let csProject      = null;
let deferredPrompt = null;
let isMobile       = false;
let isStandalone   = false;
let selectedImage  = null;

// ─── Custom searchable select ─────────────────────────────────────────────────

let _openSelect = null;

class CustomSelect {
    constructor(wrapId, placeholder = 'Select…') {
        this.wrap        = document.getElementById(wrapId);
        this.placeholder = placeholder;
        this.value       = '';
        this.options     = [];
        this.filtered    = [];
        this.focusedIdx  = -1;
        this.isOpen      = false;
        this._build();
        this._bind();
    }

    _build() {
        this.hiddenInput = this.wrap.querySelector('input[type=hidden]');

        this.trigger = document.createElement('button');
        this.trigger.type = 'button';
        this.trigger.className = 'cs-trigger';
        this.trigger.setAttribute('aria-haspopup', 'listbox');
        this.trigger.setAttribute('aria-expanded', 'false');

        this.displayEl = document.createElement('span');
        this.displayEl.className = 'cs-display cs-placeholder';
        this.displayEl.textContent = this.placeholder;
        this.trigger.appendChild(this.displayEl);

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'cs-chevron');
        svg.setAttribute('viewBox', '0 0 20 20');
        svg.setAttribute('fill', 'currentColor');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('fill-rule', 'evenodd');
        path.setAttribute('clip-rule', 'evenodd');
        path.setAttribute('d', 'M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z');
        svg.appendChild(path);

        this.panel = document.createElement('div');
        this.panel.className = 'cs-panel';
        this.panel.hidden = true;

        const searchBar = document.createElement('div');
        searchBar.className = 'cs-search-bar';

        this.searchInput = document.createElement('input');
        this.searchInput.type = 'text';
        this.searchInput.className = 'cs-search';
        this.searchInput.placeholder = 'Search…';
        this.searchInput.setAttribute('autocomplete', 'off');
        this.searchInput.setAttribute('autocorrect', 'off');
        this.searchInput.setAttribute('autocapitalize', 'off');
        this.searchInput.setAttribute('spellcheck', 'false');
        searchBar.appendChild(this.searchInput);

        this.list = document.createElement('ul');
        this.list.className = 'cs-list';
        this.list.setAttribute('role', 'listbox');

        this.panel.appendChild(searchBar);
        this.panel.appendChild(this.list);

        this.wrap.appendChild(this.trigger);
        this.wrap.appendChild(svg);
        this.wrap.appendChild(this.panel);
    }

    _bind() {
        this.trigger.addEventListener('click', () => this.isOpen ? this.close() : this.open());
        this.trigger.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
                e.preventDefault();
                this.open();
            }
        });
        this.searchInput.addEventListener('input', () => this._filter());
        this.searchInput.addEventListener('keydown', (e) => this._handleKeydown(e));
        document.addEventListener('click', (e) => {
            if (this.isOpen && !this.wrap.contains(e.target)) this.close();
        });
    }

    setOptions(opts) {
        this.options = opts;
        this._filter();
    }

    _filter() {
        const q = this.searchInput.value.toLowerCase();
        this.filtered = q
            ? this.options.filter(o => o.toLowerCase().includes(q))
            : this.options.slice();
        this.focusedIdx = -1;
        this._renderList();
    }

    _renderList() {
        this.list.innerHTML = '';
        if (this.filtered.length === 0) {
            const li = document.createElement('li');
            li.className = 'cs-no-results';
            li.textContent = 'No results';
            this.list.appendChild(li);
            return;
        }
        this.filtered.forEach((opt, i) => {
            const li = document.createElement('li');
            li.className = 'cs-option' + (opt === this.value ? ' cs-selected' : '');
            li.setAttribute('role', 'option');
            li.dataset.value = opt;
            li.textContent = opt;
            li.addEventListener('mousedown', (e) => { e.preventDefault(); this.select(opt); });
            let _touchStartY = 0;
            li.addEventListener('touchstart', (e) => { _touchStartY = e.touches[0].clientY; }, { passive: true });
            li.addEventListener('touchend', (e) => {
                if (Math.abs(e.changedTouches[0].clientY - _touchStartY) > 8) return; // scroll, not tap
                e.preventDefault();
                this.select(opt);
            });
            li.addEventListener('mouseover', () => { this.focusedIdx = i; this._updateFocus(); });
            this.list.appendChild(li);
        });
    }

    _updateFocus() {
        const items = this.list.querySelectorAll('.cs-option');
        items.forEach((li, i) => li.classList.toggle('cs-focused', i === this.focusedIdx));
        if (this.focusedIdx >= 0 && items[this.focusedIdx]) {
            items[this.focusedIdx].scrollIntoView({ block: 'nearest' });
        }
    }

    _handleKeydown(e) {
        const items = this.list.querySelectorAll('.cs-option');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            this.focusedIdx = Math.min(this.focusedIdx + 1, items.length - 1);
            this._updateFocus();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            this.focusedIdx = Math.max(this.focusedIdx - 1, 0);
            this._updateFocus();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (this.focusedIdx >= 0 && items[this.focusedIdx]) {
                this.select(items[this.focusedIdx].dataset.value);
            }
        } else if (e.key === 'Escape') {
            this.close();
            this.trigger.focus();
        } else if (e.key === 'Tab') {
            this.close();
        }
    }

    select(val) {
        this.value = val;
        this.hiddenInput.value = val;
        this.displayEl.textContent = val || this.placeholder;
        this.displayEl.classList.toggle('cs-placeholder', !val);
        this.close();
        this.trigger.focus();
        this.hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
    }

    open() {
        if (_openSelect && _openSelect !== this) _openSelect.close();
        _openSelect = this;
        this.isOpen = true;
        this.wrap.classList.add('open');
        this.panel.hidden = false;
        this.trigger.setAttribute('aria-expanded', 'true');
        this.searchInput.value = '';
        this._filter();
        requestAnimationFrame(() => { this.searchInput.focus(); });
    }

    close() {
        if (_openSelect === this) _openSelect = null;
        this.isOpen = false;
        this.wrap.classList.remove('open');
        this.panel.hidden = true;
        this.trigger.setAttribute('aria-expanded', 'false');
    }

    reset() {
        this.value = '';
        this.hiddenInput.value = '';
        this.displayEl.textContent = this.placeholder;
        this.displayEl.classList.add('cs-placeholder');
    }
}

// ─── Helpers ─────────────────────────────────────────────────────────────────

function authHeaders(extra = {}) {
    return { 'Authorization': `Bearer ${sessionToken}`, 'Content-Type': 'application/json', ...extra };
}

let toastTimer = null;
function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
}

// ─── From/To history ──────────────────────────────────────────────────────────

function getFromToHistory() {
    try { return JSON.parse(localStorage.getItem(FROMTO_HIST_KEY)) || []; }
    catch { return []; }
}

function saveFromToHistory(val) {
    if (!val) return;
    let hist = getFromToHistory();
    hist = [val, ...hist.filter(h => h !== val)].slice(0, 40);
    localStorage.setItem(FROMTO_HIST_KEY, JSON.stringify(hist));
    refreshFromToDatalist(hist);
}

function refreshFromToDatalist(hist) {
    const dl = document.getElementById('fromto-suggestions');
    dl.innerHTML = '';
    hist.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h;
        dl.appendChild(opt);
    });
}

// ─── Auth ─────────────────────────────────────────────────────────────────────

async function validateToken(token) {
    if (!token) return null;
    try {
        const res = await fetch(`${AUTH_URL}?action=get_current_user`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const data = await res.json();
            return data?.username || null;
        }
    } catch { /* offline */ }
    return null;
}

function openLoginPopup() {
    const popup = window.open(
        'https://instrumenta.cc/mobilelogin.php',
        'Login',
        'width=400,height=580,scrollbars=yes,resizable=yes'
    );
    if (!popup) {
        document.getElementById('auth-msg').textContent = 'Popup blocked — please allow popups for this site.';
    }
}

window.addEventListener('message', async (event) => {
    if (event.origin !== 'https://instrumenta.cc') return;
    if (event.data?.type !== 'AUTH_SUCCESS') return;
    const token = event.data.token || event.data.apikey;
    if (!token) return;
    sessionToken = token;
    localStorage.setItem(TOKEN_KEY, token);
    const username = await validateToken(token);
    if (username) {
        localStorage.setItem(USER_KEY, username);
        showAppScreen(username);
    } else {
        document.getElementById('auth-msg').textContent = 'Sign-in failed — please try again.';
    }
});

function doLogout() {
    sessionToken = null;
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    showAuthScreen();
    fetch(`${AUTH_URL}?action=logout`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
}

// ─── Schema / Dropdowns ──────────────────────────────────────────────────────

async function loadSchema() {
    const res = await fetch(SCHEMA_URL, { headers: authHeaders() });
    if (!res.ok) throw new Error(`Schema fetch failed: ${res.status}`);
    return res.json();
}

async function initForm() {
    const loading = document.getElementById('schema-loading');
    const form    = document.getElementById('entry-form');
    loading.classList.remove('hidden');
    form.classList.add('hidden');

    if (!csAccount) csAccount = new CustomSelect('cs-account', 'Select account…');
    if (!csProject) csProject = new CustomSelect('cs-project', 'Select project…');

    try {
        const schema     = await loadSchema();
        const accountCol = schema.columns.find(c => c.name === 'Account');
        const projectCol = schema.columns.find(c => c.name === 'Project Title');

        if (accountCol?.options?.length) csAccount.setOptions(accountCol.options);
        if (projectCol?.options?.length) csProject.setOptions(projectCol.options);
    } catch (err) {
        console.error('Failed to load schema:', err);
        showToast('Could not load form options — check connection', 'error');
    }

    document.getElementById('field-date').value = todayISO();
    refreshFromToDatalist(getFromToHistory());

    loading.classList.add('hidden');
    form.classList.remove('hidden');

    // Auto-focus amount for fast entry
    requestAnimationFrame(() => document.getElementById('field-amount').focus());
}

// ─── Screens ──────────────────────────────────────────────────────────────────

function showAuthScreen() {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display  = 'none';
}

function showAppScreen(username) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display  = 'block';
    document.getElementById('username-display').textContent = username;
    initForm();
}

// ─── Startup ─────────────────────────────────────────────────────────────────

(async function init() {
    const cachedUser = localStorage.getItem(USER_KEY);
    if (sessionToken) {
        if (navigator.onLine) {
            const username = await validateToken(sessionToken);
            if (username) {
                localStorage.setItem(USER_KEY, username);
                showAppScreen(username);
                return;
            }
            sessionToken = null;
            localStorage.removeItem(TOKEN_KEY);
        } else if (cachedUser) {
            showAppScreen(cachedUser);
            return;
        }
    }
    showAuthScreen();
    initInstallPrompt();
})();

// ─── Auth button wiring ───────────────────────────────────────────────────────

document.getElementById('signin-btn').addEventListener('click', openLoginPopup);
document.getElementById('logout-btn').addEventListener('click', doLogout);

// ─── Amount toggle ────────────────────────────────────────────────────────────

document.getElementById('sign-toggle').addEventListener('click', () => {
    isNegative = !isNegative;
    const btn = document.getElementById('sign-toggle');
    btn.textContent = isNegative ? '−' : '+';
    btn.className = `sign-toggle ${isNegative ? 'neg' : 'pos'}`;
});

// Select all on focus so typing immediately replaces the value
document.getElementById('field-amount').addEventListener('focus', function() { this.select(); });

// ─── Image picker ─────────────────────────────────────────────────────────────

document.getElementById('img-pick-btn').addEventListener('click', () => {
    document.getElementById('field-image-input').click();
});

document.getElementById('field-image-input').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    document.getElementById('img-upload-status').textContent = 'Processing…';
    selectedImage = await compressImage(file);
    const url = URL.createObjectURL(selectedImage);
    const preview = document.getElementById('img-preview');
    preview.src = url;
    document.getElementById('img-pick-btn').style.display = 'none';
    document.getElementById('img-preview-wrap').style.display = 'inline-block';
    const kb = Math.round(selectedImage.size / 1024);
    document.getElementById('img-upload-status').textContent = `${kb} KB`;
});

document.getElementById('img-remove-btn').addEventListener('click', () => {
    clearImageField();
});

function clearImageField() {
    selectedImage = null;
    const input = document.getElementById('field-image-input');
    input.value = '';
    const preview = document.getElementById('img-preview');
    if (preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src);
    preview.src = '';
    document.getElementById('img-preview-wrap').style.display = 'none';
    document.getElementById('img-pick-btn').style.display = 'flex';
    document.getElementById('img-upload-status').textContent = '';
}

function compressImage(file) {
    return new Promise((resolve) => {
        const img = new Image();
        const blobUrl = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(blobUrl);
            const MAX = 1600;
            let { naturalWidth: w, naturalHeight: h } = img;
            if (w > MAX || h > MAX) {
                if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
                else        { w = Math.round(w * MAX / h); h = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width  = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            // Grayscale + contrast boost for document readability
            const id   = ctx.getImageData(0, 0, w, h);
            const data = id.data;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const v    = Math.min(255, Math.max(0, (gray - 128) * 1.25 + 128));
                data[i] = data[i + 1] = data[i + 2] = v;
            }
            ctx.putImageData(id, 0, 0);

            canvas.toBlob(resolve, 'image/jpeg', 0.82);
        };
        img.src = blobUrl;
    });
}

async function uploadImage(file) {
    document.getElementById('img-upload-status').textContent = 'Uploading…';
    const res = await fetch(BLOBS_URL, {
        method: 'POST',
        headers: {
            'Authorization': `Bearer ${sessionToken}`,
            'Content-Type': file.type || 'image/jpeg',
            'X-Filename': file.name || 'receipt.jpg',
            'X-Parent-Id': FILE_ID,
        },
        body: file,
    });
    if (!res.ok) throw new Error(`Image upload failed: ${res.status}`);
    const data = await res.json();
    document.getElementById('img-upload-status').textContent = '';
    return data;
}

// ─── Form submit ──────────────────────────────────────────────────────────────

document.getElementById('entry-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!csAccount?.value) {
        showToast('Please select an account', 'error');
        csAccount?.trigger.focus();
        return;
    }

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    const rawAmount = parseFloat(document.getElementById('field-amount').value) || 0;
    const amount    = isNegative ? -Math.abs(rawAmount) : Math.abs(rawAmount);
    const fromto    = document.getElementById('field-fromto').value.trim();

    const row = {
        'Date':          document.getElementById('field-date').value,
        'Amount':        amount,
        'From/To':       fromto,
        'Notes':         document.getElementById('field-notes').value.trim(),
        'Account':       document.getElementById('field-account').value,
        'Project Title': document.getElementById('field-project').value,
        'Mobile':        true,
    };

    try {
        if (selectedImage) {
            const blob = await uploadImage(selectedImage);
            row['Image'] = blob.blobId;
        }

        const res = await fetch(ROWS_URL, {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify(row)
        });

        if (res.ok) {
            if (fromto) saveFromToHistory(fromto);

            // Partial reset: clear per-entry fields, keep account/project/date
            document.getElementById('field-amount').value = '';
            document.getElementById('field-fromto').value = '';
            document.getElementById('field-notes').value  = '';
            isNegative = true;
            const btn = document.getElementById('sign-toggle');
            btn.textContent = '−';
            btn.className = 'sign-toggle neg';
            clearImageField();

            showToast('Entry added');
            document.getElementById('field-amount').focus();
        } else if (res.status === 401) {
            showToast('Session expired — please sign in again', 'error');
            doLogout();
        } else {
            const data = await res.json().catch(() => ({}));
            showToast(data.error || `Error ${res.status}`, 'error');
        }
    } catch {
        showToast('Network error — check your connection', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
    }
});

// ─── Offline banner ───────────────────────────────────────────────────────────

function updateOnlineStatus() {
    document.getElementById('offline-banner').style.display = navigator.onLine ? 'none' : 'block';
}
window.addEventListener('online',  updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ─── Install Prompt ──────────────────────────────────────────────────────────────

function initInstallPrompt() {
    // Check mobile & standalone status
    isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

    // Skip for desktop/already installed
    if (!isMobile || isStandalone) return;

    // Show install prompt immediately
    loadManifestAndShow();

    // Listen for beforeinstallprompt (for capable browsers)
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });
}

async function loadManifestAndShow() {
    try {
        const manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
            const manifest = await fetch(manifestLink.href).then(r => r.json());
            showInstallPrompt(manifest);
        } else {
            showInstallPrompt({});
        }
    } catch (err) {
        console.warn('Could not load manifest:', err);
        showInstallPrompt({});
    }
}

function showInstallPrompt(manifest) {
    const overlay = document.getElementById('install-overlay');
    const icon = document.getElementById('install-icon');
    const title = document.getElementById('install-title');
    const desc = document.getElementById('install-description');
    const instr = document.getElementById('install-instruction');

    // Set manifest data
    title.textContent = manifest.name || 'Ledger Entry';
    desc.textContent = manifest.description || 'Quick and easy expense tracking on the go.';
    const iconUrl = manifest.icons?.find(i => i.sizes === '512x512')?.src || '/favicon.svg';
    icon.src = iconUrl;
    icon.onerror = () => { icon.style.display = 'none'; };

    // Platform-specific instructions
    if (/android/i.test(navigator.userAgent)) {
        instr.innerHTML = 'Tap the <strong>⋮ menu</strong> in your browser and select <strong>Add to Home screen</strong> to install.';
    } else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        instr.innerHTML = `Tap the <strong>Share</strong> button <svg class="ios-share-icon" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"><path d="M30.3 13.7L25 8.4l-5.3 5.3-1.4-1.4L25 5.6l6.7 6.7z"/><path d="M24 7h2v21h-2z"/><path d="M35 40H15c-1.7 0-3-1.3-3-3V19c0-1.7 1.3-3 3-3h7v2h-7c-.6 0-1 .4-1 1v18c0 .6.4 1 1 1h20c.6 0 1-.4 1-1V19c0-.6-.4-1-1-1h-7v-2h7c1.7 0 3 1.3 3 3v18c0 1.7-1.3 3-3 3z"/></svg> then tap <strong>Add to Home Screen</strong>.`;
    } else {
        instr.textContent = 'Use your browser\'s install option to add this app to your home screen.';
    }

    overlay.classList.remove('hidden');
}

function hideInstallPrompt() {
    const overlay = document.getElementById('install-overlay');
    overlay.classList.add('hidden');
}
